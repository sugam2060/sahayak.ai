version: '3.8'

services:
  # ----------------------------------------------------
  # Single-Node KRaft Kafka Broker
  # ----------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: sahayak-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      # Dev optimizations for single-broker instance
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: '4L62xkiaTFaJZtEPPItygg'
      KAFKA_HEAP_OPTS: '-Xmx256m -Xms128m'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b 127.0.0.1:29092 1 10"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ----------------------------------------------------
  # Kafka UI
  # ----------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sahayak-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "sahayak-single-node-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------
  # Microservices Architecture (Pushed DockerHub Images)
  # ----------------------------------------------------
  
  api_gateway:
    image: sugam2060/sahayak-api-gateway:latest
    container_name: sahayak-api-gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Route internally to container service names instead of localhost
      - AUTH_SERVICE_ADDR=auth_service:50051
      - CHATAI_SERVICE_ADDR=chatai_service:50052
      - WORKERS_SERVICE_ADDR=workers:50053
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
      auth_service:
        condition: service_started
      chatai_service:
        condition: service_started
      workers:
        condition: service_started
    restart: unless-stopped

  auth_service:
    image: sugam2060/sahayak-auth-service:latest
    container_name: sahayak-auth-service
    expose:
      - "50051"
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  chatai_service:
    image: sugam2060/sahayak-chatai-service:latest
    container_name: sahayak-chatai-service
    expose:
      - "50052"
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  workers:
    image: sugam2060/sahayak-workers:latest
    container_name: sahayak-workers
    expose:
      - "50053"
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka_data:
    driver: local